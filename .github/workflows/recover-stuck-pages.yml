name: Clean inactive duplicate Pages deployment
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-stuck-pages.yml'
permissions:
  contents: read
  deployments: write
jobs:
  recover-inactive-only:
    runs-on: ubuntu-latest
    steps:
      - name: Verify legacy deployment matches expected SHA and inactive status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=7583266180
          expected=bc3d6f787749cb99a60d8f4d90a8a4aacfa858aa
          actual=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id" --jq '.sha')
          state=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=1" --jq '.[0].state')
          echo "Record state: $state"
          test "$actual" = "$expected"
          test "$state" = "inactive"
          echo "Only the inactive duplicate is eligible for cleanup."
      - name: Remove old inactive duplicate record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/deployments/7583266180"
