name: Diagnose old GitHub Pages deployment (read only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-stuck-pages.yml'
permissions:
  contents: read
  deployments: read
  pages: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check last successful Pages record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pages/deployments/bc3d6f787749cb99a60d8f4d90a8a4aacfa858aa" || true
      - name: Show deployment records for Pages environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=20" --jq '.[] | {id, sha, environment, created_at}' || true
      - name: Explain diagnosis
        run: |
          echo "READ ONLY diagnostic; no deployment will be deleted or cancelled."
