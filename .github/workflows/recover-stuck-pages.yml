name: Clear obsolete Pages deployment lock
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-stuck-pages.yml'
permissions:
  contents: read
  deployments: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact obsolete deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=7583273886
          expected=bc3d6f787749cb99a60d8f4d90a8a4aacfa858aa
          actual=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id" --jq '.sha')
          test "$actual" = "$expected"
          echo "Only old GitHub deployment $id is selected; repository and site source are unchanged."
      - name: Mark legacy Pages deployment as superseded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/deployments/7583273886/statuses" -f state=inactive -f description="Superseded; cleanup after stale Pages lock."
      - name: Delete only this obsolete deployment record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/deployments/7583273886"
