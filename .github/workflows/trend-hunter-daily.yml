name: Trend Hunter - Daily research
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trend-hunter-daily.yml'
      - 'trendhunter/**'
      - 'office/**'
  workflow_dispatch:
  schedule:
    - cron: '23 0 * * *' # sekitar 07:23 WIB, best-effort
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pixel-office-publication
  cancel-in-progress: false
jobs:
  research:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Agent 1
        run: python -m unittest discover -s tests -v
      - name: Collect public signals
        run: python -m trendhunter.daily
      - name: Save latest report and 30-day history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add office/data/latest.json office/data/seen.json office/data/history.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: update public trend signals'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Prepare GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pixel Office
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./office
      - name: Publish Pixel Office with the current report
        id: deploy
        uses: actions/deploy-pages@v4
# Intentionally one pipeline: bot commits using GITHUB_TOKEN do not trigger
# another workflow via push. Keeping deployment here avoids stale reports.
