name: Trend Hunter - Daily research
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trend-hunter-daily.yml'
      - 'trendhunter/**'
  workflow_dispatch:
  schedule:
    - cron: '23 0 * * *' # sekitar 07:23 WIB; best-effort, not exact
permissions:
  contents: write
concurrency:
  group: trend-hunter-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Agent 1
        run: python -m unittest discover -s tests -v
      - name: Collect public signals
        run: python -m trendhunter.daily
      - name: Save daily report and 30-day history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add office/data/latest.json office/data/seen.json office/data/history.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: update public trend signals'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
# Note: Publishing is handled ONLY by deploy-pages.yml after the office/data
# commit. This prevents competing GitHub Pages deployments.
